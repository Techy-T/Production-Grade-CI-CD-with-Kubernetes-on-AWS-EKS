apiVersion: apps/v1

kind: Deployment

metadata:
  name: ${APP_NAME}

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: ${APP_NAME}

  template:
    metadata:
      labels:
        app: ${APP_NAME}

    spec:
      containers:
      - name: ${APP_NAME}

        image: ${IMAGE_REPO}:${IMAGE_TAG}

        ports:
        - containerPort: 8080

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"

          limits:
            memory: "512Mi"
            cpu: "500m"

        readinessProbe:
          httpGet:
            path: /
            port: 8080

        livenessProbe:
          httpGet:
            path: /
            port: 8080